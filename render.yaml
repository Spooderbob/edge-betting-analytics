services:
  - type: web
    name: edge-app
    env: python
    buildCommand: >
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false
    healthCheckPath: /health
